<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAT Mailer — Sign In</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237c6cf0%22/><text x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>D</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #101012;
    --surface: #18181c;
    --border: #26262c;
    --text: #ececf1;
    --muted: #8b8b96;
    --accent: #7c6cf0;
    --accent-hover: #6a5ae0;
    --green: #22c55e;
    --red: #ef4444;
    --radius: 12px;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px),
                      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
  }
  .card {
    position: relative; z-index: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 20px; font-weight: 700; }
  .logo-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; padding: 11px;
    background: var(--accent);
    border: none; border-radius: 8px;
    color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
    transition: opacity .15s, transform .1s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px;
    color: #fca5a5;
    font-size: 13px;
    padding: 10px 14px;
    margin-bottom: 16px;
    display: none;
  }
  .error.show { display: block; }
  .forgot-link {
    display: block; text-align: center; margin-top: 16px;
    font-size: 13px; color: var(--muted); text-decoration: none; transition: color .15s;
  }
  .forgot-link:hover, .forgot-link:focus-visible { color: var(--accent); }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">✉</div>
    <div>
      <div class="logo-text">DAT Mailer</div>
      <div class="logo-sub">Freight Outreach Automation</div>
    </div>
  </div>
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your account to continue</p>

  {% if error %}
  <div class="error show">{{ error }}</div>
  {% endif %}

  <div class="error" id="err" role="alert" aria-live="polite"></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button class="btn" id="loginBtn" type="submit">Sign In</button>
  </form>
  <a href="/reset-password" class="forgot-link">Forgot password?</a>
</div>

<script>
  let CSRF_TOKEN = '{{ csrf_token|default("", true) }}';
  // If CSRF token missing (page rendered without it), redirect to proper login
  if (!CSRF_TOKEN && window.location.pathname !== '/login') {
    window.location.href = '/login';
  }
  document.getElementById('loginForm').addEventListener('submit', e => { e.preventDefault(); doLogin(); });

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const err = document.getElementById('err');
    const btn = document.getElementById('loginBtn');
    if (!email || !password) { showErr('Please fill in all fields'); return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN},
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) { window.location.href = '/'; }
      else {
        showErr(data.error || 'Login failed');
        btn.disabled = false; btn.textContent = 'Sign In';
        const pw = document.getElementById('password');
        pw.value = ''; pw.focus();
      }
    } catch(e) { showErr('Could not reach the server — check your connection and try again'); btn.disabled = false; btn.textContent = 'Sign In'; }
  }

  function showErr(msg) {
    const err = document.getElementById('err');
    err.textContent = msg; err.classList.add('show');
  }
</script>
</body>
</html>
