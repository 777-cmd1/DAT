<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAT Mailer — Create Account</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237c6cf0%22/><text x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>D</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #101012; --surface: #18181c; --border: #26262c;
    --text: #ececf1; --muted: #8b8b96;
    --accent: #7c6cf0; --green: #22c55e;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 24px;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px),
                      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px; opacity: 0.3;
  }
  .card {
    position: relative; z-index: 1;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 40px; width: 100%; max-width: 420px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
  .logo-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .logo-text { font-size: 20px; font-weight: 700; }
  .logo-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .invite-badge {
    background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #86efac;
    margin-bottom: 24px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: inherit;
    font-size: 14px; padding: 10px 14px; outline: none; transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  input[readonly] { opacity: 0.6; cursor: not-allowed; }
  .btn {
    width: 100%; padding: 11px;
    background: var(--accent);
    border: none; border-radius: 8px; color: #fff;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 8px; transition: opacity .15s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px; color: #fca5a5; font-size: 13px;
    padding: 10px 14px; margin-bottom: 16px; display: none;
  }
  .error.show { display: block; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .strength { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .strength-bar { height: 100%; width: 0; border-radius: 2px; background: #ef4444; transition: width .2s, background .2s; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">✉</div>
    <div>
      <div class="logo-text">DAT Mailer</div>
      <div class="logo-sub">Freight Outreach Automation</div>
    </div>
  </div>
  <div class="invite-badge">✓ You've been invited to join DAT Mailer</div>
  <h1>Create your account</h1>
  <p class="subtitle">Set up your credentials to get started</p>
  <div class="error" id="err" role="alert" aria-live="polite"></div>
  <form id="regForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" value="{{ email }}" readonly>
    </div>
    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" placeholder="John Smith" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min 8 characters" autocomplete="new-password" required oninput="updateStrength()">
      <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
      <div class="hint" id="strengthHint">At least 8 characters</div>
    </div>
    <div class="field">
      <label for="password2">Confirm password</label>
      <input type="password" id="password2" placeholder="Repeat password" autocomplete="new-password" required>
    </div>
    <button class="btn" id="regBtn" type="submit">Create Account</button>
  </form>
</div>

<script>
  const TOKEN      = "{{ token }}";
  const CSRF_TOKEN = "{{ csrf_token }}";

  async function doRegister() {
    const name = document.getElementById('name').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const btn = document.getElementById('regBtn');

    if (!name) { showErr('Please enter your name'); return; }
    if (password.length < 8) { showErr('Password must be at least 8 characters'); return; }
    if (password !== password2) { showErr('Passwords do not match'); return; }

    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN},
        body: JSON.stringify({ token: TOKEN, name, password })
      });
      const data = await res.json();
      if (res.ok) { window.location.href = '/'; }
      else { showErr(data.error || 'Registration failed'); btn.disabled = false; btn.textContent = 'Create Account'; }
    } catch(e) { showErr('Network error'); btn.disabled = false; btn.textContent = 'Create Account'; }
  }

  function showErr(msg) {
    const err = document.getElementById('err');
    err.textContent = msg; err.classList.add('show');
  }

  function updateStrength() {
    const v = document.getElementById('password').value;
    let score = 0;
    if (v.length >= 8) score++;
    if (v.length >= 12) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/\d/.test(v) || /[^A-Za-z0-9]/.test(v)) score++;
    const bar = document.getElementById('strengthBar');
    const hint = document.getElementById('strengthHint');
    const levels = [
      { w: '10%', c: '#ef4444', t: 'Too short — at least 8 characters' },
      { w: '35%', c: '#f59e0b', t: 'Weak — add length or mixed case' },
      { w: '60%', c: '#f59e0b', t: 'Okay — could be stronger' },
      { w: '80%', c: '#22c55e', t: 'Good password' },
      { w: '100%', c: '#22c55e', t: 'Strong password' },
    ];
    const l = levels[score];
    bar.style.width = v ? l.w : '0';
    bar.style.background = l.c;
    hint.textContent = v ? l.t : 'At least 8 characters';
  }

  document.getElementById('regForm').addEventListener('submit', e => { e.preventDefault(); doRegister(); });
</script>
</body>
</html>
